[project]
name = "odoo-addons-openg2p-odoo-commons"
version = "0.0.0"
dependencies = [
    "odoo-addon-g2p_app_filter @ {root:uri}/g2p_app_filter",
    "odoo-addon-g2p_auth_oidc @ {root:uri}/g2p_auth_oidc",
    "odoo-addon-g2p_auth_oidc_keycloak @ {root:uri}/g2p_auth_oidc_keycloak",
    "odoo-addon-g2p_disable_password_login @ {root:uri}/g2p_disable_password_login",
    "odoo-addon-g2p_documents @ {root:uri}/g2p_documents",
    "odoo-addon-g2p_documents_bootstrap_s3 @ {root:uri}/g2p_documents_bootstrap_s3",
    "odoo-addon-g2p_security @ {root:uri}/g2p_security",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
bypass-selection = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
